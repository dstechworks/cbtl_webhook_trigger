<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Techworks</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
</head>

<body>
    <div class="top-alert" id="topAlert">Submitted Successfully!</div>

    <div class="card">
        <h2>Submit Your Information</h2>
        <form id="submitForm">
            <div class="form-group">
                <label for="dataInput">Enter Name:</label>
                <input type="text" id="dataInput" name="dataInput" required />
            </div>

            <div class="form-group">
                <label for="displayInput">Select Display:</label>
                <input type="text" id="displayInput" name="displayInput" placeholder="Search display..."
                    autocomplete="off" />
                <div class="dropdown" id="dropdownBox"></div>
            </div>

            <button type="submit">Submit</button>
            <div id="formLoader" class="loader" style="display: none;">Submitting...</div>
        </form>
    </div>

    <script src="index.js"></script>
</body>

</html>
